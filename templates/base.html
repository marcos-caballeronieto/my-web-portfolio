    <style>
        .social-icon {

        }

            color: #0d6efd !important;   
        }

        dna-border {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%; 
            display: block;
            pointer-events: none; 
            z-index: 0;
            opacity: 0.6;
            mask-image: linear-gradient(to right, transparent, white 30%, white 70%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, white 30%, white 70%, transparent);
        }

        .nav-link {
            position: relative;
            transition: color 0.3s ease;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 5px;
            left: 50%;
            background-color: #d4af37;
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        .nav-link:hover::after {
            width: 80%;
        }

        @keyframes logo-pulse {
            0% { filter: drop-shadow(0 0 2px rgba(212, 175, 55, 0.2)); }
            50% { filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.7)); }
            100% { filter: drop-shadow(0 0 2px rgba(212, 175, 55, 0.2)); }
        }

        .navbar-brand svg {
            animation: logo-pulse 4s infinite ease-in-out;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script type="module">
        // Initialize Mermaid for rendering diagrams
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        
        mermaid.initialize({ startOnLoad: false });

        document.addEventListener("DOMContentLoaded", function() {
            // Find all Mermaid code blocks and convert them to rendered diagrams
            const mermaidBlocks = document.querySelectorAll('code.language-mermaid');
            mermaidBlocks.forEach((block, index) => {
                const content = block.textContent;
                const div = document.createElement('div');
                div.classList.add('mermaid');
                div.textContent = content;
                div.id = `mermaid-chart-${index}`;
                block.parentElement.replaceWith(div);
            });
            mermaid.run();
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

    <script>
        // Configure particles.js for background animation effect
        particlesJS("particles-js", {
            "particles": {
                "number": {
                    "value": 70, 
                    "density": {
                        "enable": true,
                        "value_area": 800
                    }
                },
                "color": {
                    "value": ["#bdc3c7", "#95a5a6", "#7f8c8d"] 
                },
                "shape": {
                    "type": "circle", 
                    "stroke": {
                        "width": 0,
                        "color": "#000000"
                    }
                },
                "opacity": {
                    "value": 0.6,
                    "random": true, 
                    "anim": {
                        "enable": true,
                        "speed": 0.5, 
                        "opacity_min": 0.1,
                        "sync": false
                    }
                },
                "size": {
                    "value": 5, 
                    "random": true,
                    "anim": {
                        "enable": true,
                        "speed": 2, 
                        "size_min": 3,
                        "sync": false
                    }
                },
                "line_linked": {
                    "enable": true,
                    "distance": 150,
                    "color": "#d4af37",
                    "opacity": 0.3,
                    "width": 1
                },
                "move": {
                    "enable": true,
                    "speed": 0.8, 
                    "direction": "none",
                    "random": true,
                    "straight": false,
                    "out_mode": "out",
                    "bounce": false,
                    "attract": {
                        "enable": false
                    }
                }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": {
                    "onhover": {
                        "enable": true,
                        "mode": "bubble" 
                    },
                    "onclick": {
                        "enable": true,
                        "mode": "repulse"
                    },
                    "resize": true
                },
                "modes": {
                    "bubble": {
                        "distance": 200,
                        "size": 8, 
                        "duration": 2,
                        "opacity": 0.8,
                        "speed": 3
                    },
                    "repulse": {
                        "distance": 200,
                        "duration": 0.4
                    }
                }
            },
            "retina_detect": true
        });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.163.0/three.min.js"></script>

    <script>
        class DnaBorder extends HTMLElement {
            constructor() {
                super(); 
                this.attachShadow({ mode: 'open' });
                this.canvas = document.createElement('canvas');
                this.canvas.style.cssText = 'display: block; width: 100%; height: 100%;';
                this.shadowRoot.appendChild(this.canvas);
                this.ctx = this.canvas.getContext('2d');
                this.time = 0;
                this.animationFrameId = null;
                this.resize = this.resize.bind(this);
                this.animate = this.animate.bind(this);
                this.handleScroll = this.handleScroll.bind(this);
            }
            connectedCallback() {
                window.addEventListener('resize', this.resize);
                window.addEventListener('scroll', this.handleScroll);
                setTimeout(() => {
                    this.resize();
                    this.animate();
                    this.handleScroll(); // Initial check
                }, 0);
            }
            disconnectedCallback() {
                window.removeEventListener('resize', this.resize);
                window.removeEventListener('scroll', this.handleScroll);
                cancelAnimationFrame(this.animationFrameId);
            }
            handleScroll() {
                const scrollThreshold = 400;
                const baseOpacity = 0.8;
                const newOpacity = Math.max(0, baseOpacity - (window.scrollY / scrollThreshold) * baseOpacity);
                this.style.opacity = newOpacity;
            }
            resize() {
                // Cap DPR at 1.5 for performance
                const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
                this.canvas.width = this.canvas.clientWidth * dpr;
                this.canvas.height = this.canvas.clientHeight * dpr;
                this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            animate() {
                const { ctx, canvas } = this;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const centerY = canvas.clientHeight / 2;
                const renderQueue = [];
                const baseRadius = 12;
                const spacing = 12;
                const phaseOffset = 0.2;
                const maxDotSize = 4;
                const minDotSize = 2.5;
                const numPairs = Math.ceil(canvas.clientWidth / spacing) + 2;

                for (let i = -1; i < numPairs; i++) {
                    const x = i * spacing;
                    const yOffset = Math.sin(x * 0.005) * 2;
                    const currentCenterY = centerY + yOffset;
                    const angle = this.time + (i * phaseOffset);
                    
                    const y1 = Math.sin(angle) * baseRadius;
                    const z1 = Math.cos(angle) * baseRadius;
                    const y2 = Math.sin(angle + Math.PI) * baseRadius;
                    const z2 = Math.cos(angle + Math.PI) * baseRadius;

                    const depth1 = (z1 + baseRadius) / (baseRadius * 2);
                    const depth2 = (z2 + baseRadius) / (baseRadius * 2);
                    const midDepth = ((z1 + z2) / 2 + baseRadius) / (baseRadius * 2);

                    renderQueue.push({
                        z: (z1 + z2) / 2,
                        draw: () => {
                            ctx.beginPath();
                            ctx.moveTo(x, currentCenterY + y1);
                            ctx.lineTo(x, currentCenterY + y2);
                            
                            // Depth-based styling for rungs
                            ctx.strokeStyle = `hsl(46, 65%, ${50 + midDepth * 25}%)`;
                            ctx.globalAlpha = 0.1 + (midDepth * 0.4);
                            ctx.lineWidth = 1;
                            ctx.stroke();
                        }
                    });

                    renderQueue.push({
                        z: z1,
                        draw: () => {
                            const currentRadius = minDotSize + (depth1 * (maxDotSize - minDotSize));
                            const brightness = 40 + (depth1 * 30);
                            const color = `hsl(46, 65%, ${brightness}%)`;
                            
                            // CHEAP GLOW: Draw a larger faint circle instead of using shadowBlur
                            if (depth1 > 0.7) {
                                ctx.beginPath();
                                ctx.arc(x, currentCenterY + y1, currentRadius * 2, 0, Math.PI * 2);
                                ctx.fillStyle = color;
                                ctx.globalAlpha = (depth1 - 0.7) * 0.2;
                                ctx.fill();
                            }

                            ctx.beginPath();
                            ctx.arc(x, currentCenterY + y1, currentRadius, 0, Math.PI * 2);
                            ctx.fillStyle = color;
                            ctx.globalAlpha = 0.2 + (depth1 * 0.8);
                            ctx.fill();
                        }
                    });

                    renderQueue.push({
                        z: z2,
                        draw: () => {
                            const currentRadius = minDotSize + (depth2 * (maxDotSize - minDotSize));
                            const brightness = 40 + (depth2 * 30);
                            const color = `hsl(46, 65%, ${brightness}%)`;

                            // CHEAP GLOW
                            if (depth2 > 0.7) {
                                ctx.beginPath();
                                ctx.arc(x, currentCenterY + y2, currentRadius * 2, 0, Math.PI * 2);
                                ctx.fillStyle = color;
                                ctx.globalAlpha = (depth2 - 0.7) * 0.2;
                                ctx.fill();
                            }

                            ctx.beginPath();
                            ctx.arc(x, currentCenterY + y2, currentRadius, 0, Math.PI * 2);
                            ctx.fillStyle = color;
                            ctx.globalAlpha = 0.2 + (depth2 * 0.8);
                            ctx.fill();
                        }
                    });
                }
                renderQueue.sort((a, b) => a.z - b.z);
                renderQueue.forEach(item => item.draw());
                ctx.globalAlpha = 1.0;
                this.time += 0.015;
                this.animationFrameId = requestAnimationFrame(this.animate);
            }
        }
        customElements.define('dna-border', DnaBorder);
    </script>

    {% block extra_scripts %}
    {% endblock %}

</body>
</html>
