{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Portfolio</title>

    {% block extra_styles %}
    {% endblock %}

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="{% static 'portfolio/css/styles.css' %}">

    <style>
        /* Mantengo tus estilos específicos para iconos sociales por si acaso */
        .social-icon {
            transition: transform 0.3s ease, color 0.3s ease;
            display: inline-block;
        }
        
        .social-icon:hover {
            transform: translateY(-5px); 
            color: #0d6efd !important;   
        }
    </style>

</head>

<body class="d-flex flex-column min-vh-100">

    <div id="particles-js" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background-color: #f8f9fa;"></div>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="{% url 'home' %}">
                
                <svg width="45" height="45" viewBox="0 0 100 110" fill="none" xmlns="http://www.w3.org/2000/svg" class="me-2">
                    <path d="M50 5 L93.3 30 V80 L50 105 L6.7 80 V30 L50 5Z" stroke="#d4af37" stroke-width="3" fill="none"/>
                    
                    <circle cx="50" cy="55" r="32" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="4 2"/>
                    <circle cx="50" cy="55" r="12" fill="#d4af37"/>
                    
                    <line x1="50" y1="5" x2="50" y2="25" stroke="#d4af37" stroke-width="2"/>
                    <line x1="50" y1="85" x2="50" y2="105" stroke="#d4af37" stroke-width="2"/>
                </svg>

                <span style="font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 1.5rem; letter-spacing: -0.5px; color: #fff; line-height: 1;">
                    MC
                </span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto"> 
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'project_list' %}">All Projects</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'about' %}">About Me</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4 flex-grow-1">
        {% block content %}
        {% endblock %}
    </div>

    <footer class="bg-dark text-white py-3 mt-5 border-top border-secondary">
        <div class="container text-center">
            
            <div class="row justify-content-center">
                <div class="col-md-8">
                    
                    <h6 class="mb-3 fw-light text-white-50">Get in contact</h6>

                    <div class="mb-3">
                        <a href="https://github.com/marcos-caballeronieto" target="_blank" class="text-white text-decoration-none mx-3 social-icon">
                            <i class="fab fa-github fa-2x"></i>
                        </a>

                        <a href="https://linkedin.com/in/marcos-caballero-7a1656327/" target="_blank" class="text-white text-decoration-none mx-3 social-icon">
                            <i class="fab fa-linkedin fa-2x"></i>
                        </a>

                        <a href="mailto:marcos.caballeronieto@gmail.com" class="text-white text-decoration-none mx-3 social-icon">
                            <i class="fas fa-envelope fa-2x"></i>
                        </a>
                    </div>

                    <hr class="border-secondary my-2 w-50 mx-auto">

                    <div class="small text-white-50 mt-2">
                        &copy; 2025 My Portfolio. Created with 
                        <span class="text-white">Django</span> & 
                        <span class="text-white">Bootstrap</span>.
                    </div>
                </div>
            </div>

        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        
        mermaid.initialize({ startOnLoad: false });

        document.addEventListener("DOMContentLoaded", function() {
            const mermaidBlocks = document.querySelectorAll('code.language-mermaid');
            mermaidBlocks.forEach((block, index) => {
                const content = block.textContent;
                const div = document.createElement('div');
                div.classList.add('mermaid');
                div.textContent = content;
                div.id = `mermaid-chart-${index}`;
                block.parentElement.replaceWith(div);
            });
            mermaid.run();
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": {
                    "value": 70, 
                    "density": {
                        "enable": true,
                        "value_area": 800
                    }
                },
                "color": {
                    /* AQUÍ ESTÁ EL CAMBIO: Solo tonos de gris metálico */
                    "value": ["#bdc3c7", "#95a5a6", "#7f8c8d"] 
                },
                "shape": {
                    "type": "circle", 
                    "stroke": {
                        "width": 0,
                        "color": "#000000"
                    }
                },
                "opacity": {
                    "value": 0.6,
                    "random": true, 
                    "anim": {
                        "enable": true,
                        "speed": 0.5, 
                        "opacity_min": 0.1,
                        "sync": false
                    }
                },
                "size": {
                    "value": 5, 
                    "random": true,
                    "anim": {
                        "enable": true,
                        "speed": 2, 
                        "size_min": 3,
                        "sync": false
                    }
                },
                "line_linked": {
                    "enable": true,
                    "distance": 150,
                    "color": "#d4af37", /* Mantenemos el ORO en las conexiones */
                    "opacity": 0.3, /* Un pelín más visibles para contrastar con el gris */
                    "width": 1
                },
                "move": {
                    "enable": true,
                    "speed": 0.8, 
                    "direction": "none",
                    "random": true,
                    "straight": false,
                    "out_mode": "out",
                    "bounce": false,
                    "attract": {
                        "enable": false
                    }
                }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": {
                    "onhover": {
                        "enable": true,
                        "mode": "bubble" 
                    },
                    "onclick": {
                        "enable": true,
                        "mode": "repulse"
                    },
                    "resize": true
                },
                "modes": {
                    "bubble": {
                        "distance": 200,
                        "size": 8, 
                        "duration": 2,
                        "opacity": 0.8,
                        "speed": 3
                    },
                    "repulse": {
                        "distance": 200,
                        "duration": 0.4
                    }
                }
            },
            "retina_detect": true
        });
    </script>

</body>
</html>
