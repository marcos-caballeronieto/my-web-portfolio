<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Portfolio</title>

    {% block extra_styles %}
    {% endblock %}

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* Hace que los iconos suban y cambien de color al pasar el ratón */
        .social-icon {
            transition: transform 0.3s ease, color 0.3s ease;
            display: inline-block;
        }
        
        .social-icon:hover {
            transform: translateY(-5px); /* Flota hacia arriba */
            color: #0d6efd !important;   /* Cambia a azul Bootstrap */
        }
    </style>

</head>

<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'home' %}">My Portfolio</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto"> <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'project_list' %}">All Projects</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'about' %}">About Me</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4 flex-grow-1">
        {% block content %}
        {% endblock %}
    </div>

    <footer class="bg-dark text-white py-3 mt-5 border-top border-secondary">
        <div class="container text-center">
            
            <div class="row justify-content-center">
                <div class="col-md-8">
                    
                    <h6 class="mb-3 fw-light text-white-50">Get in contact</h6>

                    <div class="mb-3">
                        <a href="https://github.com/marcos-caballeronieto" target="_blank" class="text-white text-decoration-none mx-3 social-icon">
                            <i class="fab fa-github fa-2x"></i>
                        </a>

                        <a href="https://linkedin.com/in/marcos-caballero-7a1656327/" target="_blank" class="text-white text-decoration-none mx-3 social-icon">
                            <i class="fab fa-linkedin fa-2x"></i>
                        </a>

                        <a href="mailto:marcos.caballeronieto@gmail.com" class="text-white text-decoration-none mx-3 social-icon">
                            <i class="fas fa-envelope fa-2x"></i>
                        </a>
                    </div>

                    <hr class="border-secondary my-2 w-50 mx-auto">

                    <div class="small text-white-50 mt-2">
                        &copy; 2025 My Portfolio. Created with 
                        <span class="text-white">Django</span> & 
                        <span class="text-white">Bootstrap</span>.
                    </div>
                </div>
            </div>

        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
